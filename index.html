<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>運任せTodo</title>

    <!--
      最小限の見た目だけ整えている（Tailwind は使わない）。
      各要素に class（例: omikuji-result）を付けているので、CSS を足して自由に装飾できる。
      拡張ポイント（ステップ2以降）: 結果やボタンの文言・色を変える（この <style> を編集）。
    -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h1>運任せTodo</h1>
    <p>あなたの「運」でタスクの優先順位を決定。</p>
    <p>
      簡単なタスクを大吉の方に、つらいタスクを凶の方に置いて、全部の運勢にタスクを割り当てよう。
    </p>
    <p>※途中で運勢のタスクが空になったとき、近い運勢から引っ張る</p>

    <div id="result" class="omikuji-result">ボタンを押してね</div>

    <div class="omikuji-controls">
      <button
        id="draw-button"
        onmousedown="
          this.classList.add('active-dip');
          setTimeout(() => this.classList.remove('active-dip'), 200);
        "
      >
        おみくじを引く
      </button>
      <button
        id="reset-button"
        onmousedown="
          this.classList.add('active-dip');
          setTimeout(() => this.classList.remove('active-dip'), 200);
        "
      >
        リセット（役割をdoneか「やり直す」をする）
      </button>
    </div>
    <!--大吉＞吉＞中吉＞小吉＞末吉＞凶-->

    <div class="input-table">
      <div class="input-section">あああ</div>

      <div class="input-section">あああ</div>
      <div class="input-section">あああ</div>
      <div class="input-section">あああ</div>
    </div>
    <div class="input-table">
      <div class="input-section">いいい</div>
      <div class="input-section">いいい</div>
      <div class="input-section">いいい</div>
    </div>
    <div class="input-table">
      <div class="input-section">ううう</div>
      <div class="input-section">ううう</div>
      <div class="input-section">ううう</div>
    </div>

    <div id="remaining" class="omikuji-remaining"></div>
    <ul id="history" class="omikuji-history"></ul>

    <!-- TypeScript を読み込む（Vite が変換する）。 -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
