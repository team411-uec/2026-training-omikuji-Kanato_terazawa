<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>運任せTodo</title>

    <!--
      最小限の見た目だけ整えている（Tailwind は使わない）。
      各要素に class（例: omikuji-result）を付けているので、CSS を足して自由に装飾できる。
      拡張ポイント（ステップ2以降）: 結果やボタンの文言・色を変える（この <style> を編集）。
    -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h1>運任せTodo</h1>
    <p>あなたの「運」でタスクの優先順位を決定。</p>
    <p>簡単なタスクを大吉の方に、つらいタスクを凶の方に割り当てよう。</p>
    <p>※途中で運勢のタスクが空になったとき、近い運勢から引っ張る</p>

    <div id="result" class="omikuji-result">ボタンを押してね</div>
    <div id="task-result" class="omikuji-result">選ばれたタスク</div>

    <div class="omikuji-controls">
      <button
        id="draw-button"
        onmousedown="
          this.classList.add('active-dip');
          setTimeout(() => this.classList.remove('active-dip'), 200);
        "
      >
        おみくじを引く
      </button>
      <button
        id="reset-button"
        onmousedown="
          this.classList.add('active-dip');
          setTimeout(() => this.classList.remove('active-dip'), 200);
        "
      >
        リセット（役割をdoneか「やり直す」をする）
      </button>
    </div>

    <div class="input_wrapper">
      <div class="gradition">
        <div class="gradition_daikichi">大<br />吉</div>
        <div class="vertical_line"></div>
        <div class="gradition_daikyo">大<br />凶</div>
      </div>
      <div class="input_column">
        <div class="input_section" draggable="true">
          <input type="input" placeholder=" ここにタスクを入力" />
          <label class="hamburger" for="menu_toggle">
            <input type="checkbox" id="menu-toggle" />
            <svg viewBox="0 0 32 32" width="32" height="32">
              <path class="line line-top" d="M4,10 L28,10" />
              <path class="line line-middle" d="M4,16 L28,16" />
              <path class="line line-bottom" d="M4,22 L28,22" />
            </svg>
          </label>
        </div>
      </div>
    </div>

    <div id="remaining" class="omikuji-remaining"></div>
    <ul id="history" class="omikuji-history"></ul>

    <!-- TypeScript を読み込む（Vite が変換する）。 -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
